<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>RE:WORDLE</title><style>body{margin:0;background:#121213;color:#fff;font-family:Arial}main{max-width:620px;margin:auto;padding:12px}h1,p{text-align:center}p{color:#bbb;font-size:13px}.stats{display:flex;justify-content:center;gap:28px;text-align:center}.stats b{font-size:22px}.board{max-width:340px;margin:16px auto}.r{display:grid;grid-template-columns:18px 1fr 48px;gap:5px;align-items:center;margin:5px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:3px;outline:2px solid transparent}.row.on{outline-color:#fff}.t{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid #3a3a3c;font-weight:800}.g{background:#538d4e}.y{background:#b59f3b}.x{background:#3a3a3c}.small{font-size:10px;color:#aaa}.panel{border-top:1px solid #3a3a3c;padding-top:14px}.fb{display:flex;justify-content:center;gap:4px;margin:10px}.fb .t{width:46px}.ctl{display:flex;justify-content:center;gap:6px}.modes{display:flex;flex-direction:column}.modes button,.form button{border:0;padding:8px;font-weight:800}.modes .on{background:#fff;color:#111}.form{display:flex;gap:6px}.form input{width:150px;padding:10px;text-transform:uppercase;text-align:center;font-weight:800}.kb{max-width:500px;margin:12px auto}.kr{display:flex;gap:4px;margin:4px}.k{position:relative;flex:1;height:42px;border:0;border-radius:4px;background:#818384;color:#fff;font-weight:800}.k:after{content:'';position:absolute;inset:0;border-radius:4px}.k.fy:after{border:5px solid #b59f3b}.k.fg:after{border:5px solid #538d4e}.k.fb:after{border:5px solid #111}.hist{max-width:420px;margin:auto;font-size:11px}.hi{display:flex;justify-content:space-between;border-top:1px solid #333;padding:5px}.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:8px;border-radius:4px;opacity:0}.toast.s{opacity:1}.center{text-align:center}button{cursor:pointer}</style><main><h1>RE:WORDLE</h1><p>相手のWordle盤面の色と最後の正解から、各行の予想ワードを復元せよ。</p><div class=stats><div><b id=mv>0</b><br><span class=small>MOVES</span></div><div><b id=pr></b><br><span class=small>ROWS</span></div></div><p>FINAL WORD: <b id=ans></b></p><div id=board class=board></div><div class=panel><h3 id=ttl class=center></h3><p id=hint></p><div id=feedback class=fb></div><div class=ctl><div class=modes><button id=im class=on>⌨ 入力</button><button id=fm>⚑ フラグ</button></div><form id=form class=form><input id=q maxlength=5><button>ENTER</button></form></div><p id=help></p><div id=kb class=kb></div><div id=hist class=hist></div><p class=center><button id=np>別の盤面</button></p></div></main><div id=toast class=toast></div><script>(()=>{'use strict';const P=[['PLANT',['CRANE','BLAST','PLANK','PLANT']],['LIGHT',['CRANE','SOUTH','NIGHT','MIGHT','LIGHT']],['BEACH',['STARE','REACH','TEACH','PEACH','BEACH']],['TRAIN',['HOUSE','GRAIN','DRAIN','BRAIN','TRAIN']],['HOUSE',['CRANE','MOUSE','LOUSE','ROUSE','HOUSE']],['WATER',['SLING','CATER','LATER','HATER','WATER']],['BLACK',['CRANE','BLAST','BLANK','BLACK']],['SMILE',['CRANE','SPIKE','SHINE','SLIME','SMILE']],['ROUND',['SLATE','MOUND','FOUND','BOUND','ROUND']],['STONE',['CRAMP','SHINE','STORE','STOKE','STONE']]].map(([answer,guesses])=>({answer,guesses})),K=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'],rk={x:1,y:2,g:3},fc=[null,'y','g','b'];let G,words=new Set,ready=0,timer;const $=x=>document.getElementById(x);function sc(a,b){a=a.toUpperCase();b=b.toUpperCase();let r=Array(5).fill('x'),m={};for(let i=0;i<5;i++)a[i]===b[i]?r[i]='g':m[b[i]]=(m[b[i]]||0)+1;for(let i=0;i<5;i++)if(r[i]!='g'&&(m[a[i]]||0)>0){r[i]='y';m[a[i]]--}return r}async function dict(){try{let r=await fetch('https://raw.githubusercontent.com/tabatkins/wordle-list/main/words');words=new Set((await r.text()).split(/\s+/).map(x=>x.toUpperCase()));P.forEach(p=>{words.add(p.answer);p.guesses.forEach(x=>words.add(x))});ready=1;draw()}catch(e){toast('辞書の読込に失敗')}}function start(){let p=P[Math.floor(Math.random()*P.length)];G={p,m:0,a:p.guesses.length-2,mode:'i',rows:p.guesses.map((w,i)=>({w,pat:sc(w,p.answer),sol:i==p.guesses.length-1,k:{},f:{},h:[]}))};draw()}function tile(c,l=''){let d=document.createElement('div');d.className='t '+c;d.textContent=l;return d}function draw(){$('mv').textContent=G.m;$('pr').textContent=G.rows.filter(r=>r.sol).length+'/'+G.rows.length;$('ans').textContent=G.p.answer;$('board').innerHTML='';for(let i=0;i<6;i++){let z=document.createElement('div');z.className='r';z.innerHTML='<span class=small>'+(i+1)+'</span>';let rr=G.rows[i],row=document.createElement('div');row.className='row'+(i==G.a?' on':'');if(rr){rr.pat.forEach((c,j)=>row.append(tile(c,rr.sol?rr.w[j]:'')));row.onclick=()=>{G.a=i;draw()}}else for(let j=0;j<5;j++)row.append(tile(''));z.append(row);let s=document.createElement('span');s.className='small';s.textContent=rr?(rr.sol?'SOLVED':rr.h.length+' tries'):'';z.append(s);$('board').append(z)}active()}function active(){let r=G.rows[G.a],flag=G.mode=='f';$('ttl').textContent='ROW '+(G.a+1)+' を復元';$('hint').textContent=r.sol?'復元済み: '+r.w:'元盤面: '+r.pat.map(c=>c=='g'?'🟩':c=='y'?'🟨':'⬛').join('');$('im').classList.toggle('on',!flag);$('fm').classList.toggle('on',flag);$('q').disabled=r.sol||flag||!ready;$('form').querySelector('button').disabled=r.sol||flag||!ready;$('help').textContent=!ready?'辞書を読み込み中…':flag?'キー外周を 黄→緑→黒→無印 と切替':'辞書にある5文字語だけ入力できます';$('q').value='';$('feedback').innerHTML='';let last=r.h.at(-1);for(let i=0;i<5;i++)$('feedback').append(tile(last?last.r[i]:'',last?last.q[i]:''));kb(r);hist(r)}function kb(r){$('kb').innerHTML='';K.forEach(s=>{let d=document.createElement('div');d.className='kr';[...s].forEach(ch=>{let b=document.createElement('button');b.className='k';b.textContent=ch;if(r.k[ch])b.classList.add(r.k[ch]);else if(r.f[ch])b.classList.add('f'+r.f[ch]);b.onclick=()=>{if(G.mode=='f'){if(r.k[ch])return;let n=fc[(fc.indexOf(r.f[ch]||null)+1)%4];n?r.f[ch]=n:delete r.f[ch];kb(r)}else if(ready&&$('q').value.length<5)$('q').value+=ch};d.append(b)});$('kb').append(d)})}function hist(r){$('hist').innerHTML='';[...r.h].reverse().forEach(h=>{let d=document.createElement('div');d.className='hi';d.textContent=h.q+' '+h.r.map(c=>c=='g'?'🟩':c=='y'?'🟨':'⬛').join('');$('hist').append(d)})}function submit(){let r=G.rows[G.a],q=$('q').value.toUpperCase();if(!/^[A-Z]{5}$/.test(q))return toast('英字5文字を入力してください');if(!ready)return;if(!words.has(q))return toast('辞書にない単語です');let x=sc(q,r.w);r.h.push({q,r:x});G.m++;[...q].forEach((c,i)=>{if(!r.k[c]||rk[x[i]]>rk[r.k[c]])r.k[c]=x[i];delete r.f[c]});if(q==r.w){r.sol=1;let n=G.rows.findIndex(x=>!x.sol);if(n>=0)G.a=n}draw();if(G.rows.every(x=>x.sol))toast('完全復元！ '+G.m+'手')}function toast(s){$('toast').textContent=s;$('toast').classList.add('s');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('s'),1400)}$('form').onsubmit=e=>{e.preventDefault();submit()};$('q').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,5);$('im').onclick=()=>{G.mode='i';active()};$('fm').onclick=()=>{G.mode='f';active()};$('np').onclick=start;start();dict()})();</script></html>
