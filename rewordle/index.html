<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121213" />
  <title>RE:WORDLE</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#121213;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#121213}</style>
</head>
<body>
  <iframe id="gameFrame" src="./app.html" title="RE:WORDLE"></iframe>
  <script>
  (() => {
    const PUZZLES = {
      PLANT:['CRANE','BLAST','PLANK','PLANT'], LIGHT:['CRANE','SOUTH','NIGHT','MIGHT','LIGHT'], BEACH:['STARE','REACH','TEACH','PEACH','BEACH'], TRAIN:['HOUSE','GRAIN','DRAIN','BRAIN','TRAIN'], HOUSE:['CRANE','MOUSE','LOUSE','ROUSE','HOUSE'], WATER:['SLING','CATER','LATER','HATER','WATER'], BLACK:['CRANE','BLAST','BLANK','BLACK'], SMILE:['CRANE','SPIKE','SHINE','SLIME','SMILE'], ROUND:['SLATE','MOUND','FOUND','BOUND','ROUND'], STONE:['CRAMP','SHINE','STORE','STOKE','STONE'], SHARE:['CRATE','SPARE','SHORE','SHARE'], GRACE:['SLATE','CRANE','GRADE','GRAPE','GRACE'], CLOUD:['RAISE','COULD','CLOUT','CLOUD'], DREAM:['POINT','CREAM','BREAM','DREAM'], FRAME:['AUDIO','CRANE','FLAME','FRAME'], POINT:['SLATE','MOUNT','JOINT','POINT'], SOUND:['IRATE','BOUND','FOUND','SOUND'], GREEN:['SLATE','CREED','GREET','GREEN'], CHAIR:['SLATE','CHOIR','CHAIN','CHAIR'], FLOOR:['RAISE','COLOR','FLOUR','FLOOR'], SHEEP:['CRANE','SPEED','SHEER','SHEEP'], APPLE:['STERN','AMPLE','APPLY','APPLE'], WHITE:['AROSE','WHILE','WHINE','WHITE'], WORLD:['ADIEU','COULD','WOULD','WORLD']
    };
    const frame = document.getElementById('gameFrame');
    let observer = null;
    let scheduled = false;

    function unusedLetters(doc) {
      const answer = (doc.getElementById('finalAnswer')?.textContent || '').trim().toUpperCase();
      const words = PUZZLES[answer];
      if (!words) return new Set();
      const used = new Set(words.join(''));
      return new Set([..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].filter(ch => !used.has(ch)));
    }

    function paint(doc) {
      scheduled = false;
      const unused = unusedLetters(doc);
      if (!unused.size) return;
      doc.querySelectorAll('#keyboard .key').forEach(key => {
        const letter = (key.textContent || '').trim().toUpperCase();
        if (!unused.has(letter)) return;
        key.classList.remove('flag-yellow','flag-green','flag-black','yellow','green');
        key.classList.add('gray','global-unused');
        key.setAttribute('aria-label', `${letter} この6列では未使用`);
      });
    }

    function schedulePaint(doc) {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(() => paint(doc));
    }

    function install(doc) {
      const style = doc.createElement('style');
      style.textContent = '.key.global-unused{background:#3a3a3c!important}.key.global-unused::after{border:0!important;box-shadow:none!important}';
      doc.head.appendChild(style);

      doc.addEventListener('click', event => {
        const key = event.target.closest?.('.key.global-unused');
        if (!key) return;
        if (doc.getElementById('flagModeButton')?.classList.contains('active')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      observer?.disconnect();
      const keyboard = doc.getElementById('keyboard');
      observer = new MutationObserver(() => schedulePaint(doc));
      if (keyboard) observer.observe(keyboard, {childList:true, subtree:true, attributes:true, attributeFilter:['class']});

      const answerNode = doc.getElementById('finalAnswer');
      if (answerNode) observer.observe(answerNode, {childList:true, characterData:true, subtree:true});
      schedulePaint(doc);
    }

    frame.addEventListener('load', () => {
      try { install(frame.contentDocument); } catch (error) { console.error(error); }
    });
  })();
  </script>
</body>
</html>
